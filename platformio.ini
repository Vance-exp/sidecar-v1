; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-5B1E0451171
monitor_port = /dev/cu.usbserial-5B1E0451171
lib_deps =
    m5stack/M5Unified @ ^0.2.4
    h2zero/NimBLE-Arduino @ ^1.4.0
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; NOTE: CONFIG_PM_ENABLE and CONFIG_FREERTOS_HZ were removed.
    ; The precompiled arduino-esp32 SDK ignores -D overrides for these —
    ; they only affect #if guards in OUR code, not the actual SDK behaviour.
    ; PM is disabled in the SDK; tick rate is fixed at 1000Hz.
